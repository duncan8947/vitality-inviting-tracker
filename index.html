<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Vitality Nutrition – Inviting & Conversation Tracker</title>

  <link rel="manifest" href="./manifest.json" />
  <style>
    :root { --bg:#0b0f14; --card:#111826; --muted:#9aa4b2; --text:#e6edf3; --line:#233041; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--bg); color:var(--text); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .header { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size: 20px; line-height:1.2; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn { border:1px solid var(--line); background:#0f172a; color:var(--text); padding:10px 12px; border-radius: 12px; font-weight:600; }
    .btn:active { transform: scale(.99); }
    .btn.primary { background: #0b3d2e; border-color:#0b3d2e; }
    .btn.danger { background: #3a0f18; border-color:#5b1a27; }
    .pill { padding:6px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12px; }
    input, select, textarea {
      width: 100%;
      background:#0b1220; color:var(--text);
      border:1px solid var(--line); border-radius: 12px;
      padding: 10px;
      outline: none;
    }
    textarea { min-height: 70px; resize: vertical; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    @media (max-width: 720px){ .grid { grid-template-columns: 1fr; } }
    table { width:100%; border-collapse: collapse; margin-top: 10px; overflow:hidden; border-radius: 12px; }
    th, td { padding:10px; border-bottom:1px solid var(--line); text-align:left; vertical-align: top; }
    th { color:var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing:.06em; }
    .small { font-size: 12px; color: var(--muted); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .footer { margin-top: 10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Vitality Nutrition – Inviting & Conversation Tracker</h1>
        <div class="sub">Track invites, follow-ups, and outcomes. Saves automatically on this device.</div>
      </div>
      <div class="row">
        <span class="pill" id="countPill">0 entries</span>
        <span class="pill" id="weekPill">This week: 0</span>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div class="grid">
        <div>
          <label class="small">Date</label>
          <input id="date" type="date" />
        </div>
        <div>
          <label class="small">Name</label>
          <input id="name" placeholder="e.g. Sarah" />
        </div>

        <div>
          <label class="small">Channel</label>
          <select id="channel">
            <option>Street</option>
            <option>Instagram</option>
            <option>Facebook</option>
            <option>Referral</option>
            <option>Walk-in</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label class="small">Stage</label>
          <select id="stage">
            <option>Invite sent</option>
            <option>Replied</option>
            <option>Booked evaluation</option>
            <option>Attended evaluation</option>
            <option>Joined</option>
            <option>No response</option>
            <option>Not now</option>
          </select>
        </div>
      </div>

      <div style="margin-top:10px;">
        <label class="small">Notes</label>
        <textarea id="notes" placeholder="Anything useful: goals, objections, follow-up date/time, etc."></textarea>
      </div>

      <div class="footer">
        <div class="row">
          <button class="btn primary" id="addBtn">+ Add entry</button>
          <button class="btn" id="exportBtn">Export CSV</button>
        </div>
        <div class="actions">
          <button class="btn danger" id="clearBtn">Clear all</button>
        </div>
      </div>

      <table aria-label="Entries table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Channel</th>
            <th>Stage</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="small" style="margin-top:10px;">
        Tip: Keep it simple — one entry per meaningful touchpoint (invite, follow-up, booked, attended, joined).
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "vitality_inviting_entries_v1";

    const el = (id) => document.getElementById(id);
    const tbody = el("tbody");
    const countPill = el("countPill");
    const weekPill = el("weekPill");

    function todayISO() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      return local.toISOString().slice(0,10);
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function save(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function weekCount(entries) {
      const now = new Date();
      const day = (now.getDay() + 6) % 7; // Mon=0
      const monday = new Date(now);
      monday.setDate(now.getDate() - day);
      monday.setHours(0,0,0,0);

      return entries.filter(e => {
        const dt = new Date(e.date + "T00:00:00");
        return dt >= monday;
      }).length;
    }

    function render() {
      const entries = load();
      tbody.innerHTML = "";

      entries
        .slice()
        .sort((a,b) => (b.date || "").localeCompare(a.date || ""))
        .forEach((e, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${e.date || ""}</td>
            <td>${escapeHtml(e.name || "")}</td>
            <td>${escapeHtml(e.channel || "")}</td>
            <td>${escapeHtml(e.stage || "")}</td>
            <td>${escapeHtml(e.notes || "")}</td>
            <td><button class="btn" data-del="${idx}">Delete</button></td>
          `;
          tbody.appendChild(tr);
        });

      countPill.textContent = `${entries.length} entries`;
      weekPill.textContent = `This week: ${weekCount(entries)}`;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function addEntry() {
      const date = el("date").value || todayISO();
      const name = el("name").value.trim();
      const channel = el("channel").value;
      const stage = el("stage").value;
      const notes = el("notes").value.trim();

      if (!name) {
        alert("Add a name (even if it’s just a first name).");
        return;
      }

      const entries = load();
      entries.push({ date, name, channel, stage, notes });
      save(entries);

      // reset fields (keep date)
      el("name").value = "";
      el("notes").value = "";
      el("stage").value = "Invite sent";
      el("channel").value = "Street";

      render();
    }

    function clearAll() {
      if (!confirm("Clear all entries from this device?")) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
    }

    function exportCSV() {
      const entries = load();
      if (!entries.length) { alert("No entries to export."); return; }

      const header = ["date","name","channel","stage","notes"];
      const rows = entries.map(e => header.map(k => csvCell(e[k] ?? "")));
      const csv = [header.join(","), ...rows.map(r => r.join(","))].join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `vitality-inviting-tracker-${todayISO()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(v){
      const s = String(v).replaceAll('"','""');
      return `"${s}"`;
    }

    // Events
    el("addBtn").addEventListener("click", addEntry);
    el("exportBtn").addEventListener("click", exportCSV);
    el("clearBtn").addEventListener("click", clearAll);

    tbody.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-del]");
      if (!btn) return;
      const idx = Number(btn.getAttribute("data-del"));
      const entries = load();
      // because we sort for display, simplest is delete by re-render index mapping:
      // We'll delete the oldest matching by reconstructing sorted list mapping.
      const sorted = entries.slice().sort((a,b) => (b.date || "").localeCompare(a.date || ""));
      const toDelete = sorted[idx];
      const realIndex = entries.findIndex(x =>
        x.date === toDelete.date && x.name === toDelete.name && x.channel === toDelete.channel && x.stage === toDelete.stage && x.notes === toDelete.notes
      );
      if (realIndex >= 0) entries.splice(realIndex, 1);
      save(entries);
      render();
    });

    // init
    el("date").value = todayISO();
    render();

    // register service worker (optional)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
