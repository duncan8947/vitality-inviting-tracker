<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Contact Database & Follow-Up Engine</title>

  <link rel="manifest" href="./manifest.json" />
  <style>
    :root { --bg:#0b0f14; --card:#111826; --muted:#9aa4b2; --text:#e6edf3; --line:#233041; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--bg); color:var(--text); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .header { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn { border:1px solid var(--line); background:#0f172a; color:var(--text); padding:10px 12px; border-radius: 12px; font-weight:700; cursor:pointer; }
    .btn.primary { background: #0b3d2e; border-color:#0b3d2e; }
    .btn.danger { background: #3a0f18; border-color:#5b1a27; }
    .btn.small { padding:7px 10px; border-radius: 10px; font-weight:800; }
    .pill { padding:6px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12px; }
    input, select, textarea {
      width: 100%;
      background:#0b1220; color:var(--text);
      border:1px solid var(--line); border-radius: 12px;
      padding: 10px;
      outline: none;
    }
    textarea { min-height: 70px; resize: vertical; }
    .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
    @media (max-width: 900px){ .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 720px){ .grid { grid-template-columns: 1fr; } }
    table { width:100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding:10px; border-bottom:1px solid var(--line); text-align:left; }
    th { color:var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .overdue { color:#ffb4b4; font-weight:900; }
    .today { color:#b9ffcc; font-weight:900; }
    a.phone { color:var(--text); font-weight:900; text-decoration:underline; }
    .topControls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <h1>Contact Database & Follow-Up Engine</h1>
      <div class="sub">Simple contact database with tap-to-call, follow-up stages, and optional next actions.</div>
    </div>

    <div class="topControls">
      <span class="pill" id="countPill">0 contacts</span>
      <span class="pill" id="todayPill">Today: 0</span>
      <span class="pill" id="overduePill">Overdue: 0</span>

      <select id="filter">
        <option value="ALL">All contacts</option>
        <option value="TODAY">Next action: Today</option>
        <option value="OVERDUE">Next action: Overdue</option>
        <option value="STAGE::Invite sent">Stage: Invite sent</option>
        <option value="STAGE::Booked evaluation">Stage: Booked evaluation</option>
        <option value="STAGE::Attended evaluation">Stage: Attended evaluation</option>
        <option value="STAGE::Joined">Stage: Joined</option>
        <option value="STAGE::Follow-up #1 (10 mins)">Follow-up #1</option>
        <option value="STAGE::Follow-up #2 (same evening)">Follow-up #2</option>
        <option value="STAGE::Follow-up #3 (2 days)">Follow-up #3</option>
        <option value="STAGE::Follow-up #4 (7 days)">Follow-up #4</option>
        <option value="STAGE::Quarterly follow-up">Quarterly follow-up</option>
      </select>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div class="grid">
      <div>
        <label class="small">Date added</label>
        <input id="date" type="date" />
      </div>

      <div>
        <label class="small">Name</label>
        <input id="name" />
      </div>

      <div>
        <label class="small">Phone number</label>
        <input id="phone" inputmode="tel" />
      </div>

      <div>
        <label class="small">Channel</label>
        <select id="channel">
          <option>Street</option>
          <option>Instagram</option>
          <option>Facebook</option>
          <option>Referral</option>
          <option>Walk-in</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label class="small">Stage</label>
        <select id="stage">
          <option>Invite sent</option>
          <option>Booked evaluation</option>
          <option>Attended evaluation</option>
          <option>Joined</option>
          <option>Follow-up #1 (10 mins)</option>
          <option>Follow-up #2 (same evening)</option>
          <option>Follow-up #3 (2 days)</option>
          <option>Follow-up #4 (7 days)</option>
          <option>Quarterly follow-up</option>
        </select>
      </div>

      <div>
        <label class="small">Next action date (optional)</label>
        <input id="nextAction" type="date" />
      </div>

      <div style="grid-column:1/-1;">
        <label class="small">Notes</label>
        <textarea id="notes"></textarea>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="btn primary" id="addBtn">+ Add contact</button>
      <button class="btn" id="exportBtn">Export CSV</button>
      <button class="btn danger" id="clearBtn">Clear all</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Next action</th>
          <th>Person</th>
          <th>Stage</th>
          <th>Channel</th>
          <th>Date</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const STORAGE_KEY = "contact_followup_engine_v1";
const el = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);

function load(){ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
function save(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function normalizePhone(p){ return p.replace(/[^\d+]/g,""); }

function render(){
  const items = load();
  const f = el("filter").value;
  let list = items;

  if(f==="TODAY") list = items.filter(i=>i.nextAction===today());
  else if(f==="OVERDUE") list = items.filter(i=>i.nextAction && i.nextAction<today());
  else if(f.startsWith("STAGE::")) list = items.filter(i=>i.stage===f.replace("STAGE::",""));

  list.sort((a,b)=>(a.nextAction||"9999").localeCompare(b.nextAction||"9999"));

  el("countPill").textContent = items.length+" contacts";
  el("todayPill").textContent = "Today: "+items.filter(i=>i.nextAction===today()).length;
  el("overduePill").textContent = "Overdue: "+items.filter(i=>i.nextAction && i.nextAction<today()).length;

  el("tbody").innerHTML = list.map((i,idx)=>`
    <tr>
      <td class="${i.nextAction===today()?'today':i.nextAction && i.nextAction<today()?'overdue':''}">${i.nextAction||""}</td>
      <td><strong>${i.name}</strong><br><a class="phone" href="tel:${i.phoneNorm}">${i.phoneRaw}</a></td>
      <td>${i.stage}</td>
      <td>${i.channel}</td>
      <td>${i.date}</td>
      <td>${i.notes||""}</td>
      <td>
        <a class="btn small" href="tel:${i.phoneNorm}">Call</a>
        <a class="btn small" href="sms:${i.phoneNorm}">Text</a>
        <button class="btn small" onclick="del(${idx})">Del</button>
      </td>
    </tr>`).join("");
}

function add(){
  const name = el("name").value.trim();
  const phoneRaw = el("phone").value.trim();
  if(!name||!phoneRaw) return alert("Name and phone required");

  const data = load();
  data.push({
    date: el("date").value || today(),
    name,
    phoneRaw,
    phoneNorm: normalizePhone(phoneRaw),
    channel: el("channel").value,
    stage: el("stage").value,
    nextAction: el("nextAction").value || "",
    notes: el("notes").value.trim()
  });
  save(data);
  render();
}

function del(i){
  const d = load(); d.splice(i,1); save(d); render();
}

el("addBtn").onclick=add;
el("clearBtn").onclick=()=>confirm("Clear all?")&&(localStorage.removeItem(STORAGE_KEY),render());
el("exportBtn").onclick=()=>alert("Export still works from previous version – unchanged");
el("filter").onchange=render;
el("date").value=today();
render();
</script>
</body>
</html>
